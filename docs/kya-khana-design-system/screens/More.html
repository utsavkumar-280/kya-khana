<!-- @dsCard group="Screens" viewport="430x880" name="Screen 3 — Settings & More" subtitle="Profile, cook view, settings list with red logout" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kya Khana — More</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --head: 'Plus Jakarta Sans', system-ui, sans-serif;
    --body: 'Be Vietnam Pro', system-ui, sans-serif;
    --bg: #FBF5EC;
    --card: #FFFFFF;
    --accent: #E65100;
    --accent-soft: #FFF1E3;
    --veg: #2E7D32;
    --veg-bg: #E9F4EA;
    --nonveg: #C62828;
    --nonveg-bg: #FCEBEB;
    --ink: #2A211B;
    --muted: #8C8076;
    --faint: #B6ABA0;
    --line: #EDE3D6;
    --radius-card: 22px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #E7DDCD;
    font-family: var(--body);
    color: var(--ink);
    display: grid; place-items: center;
    padding: 18px;
  }
  .device {
    width: 390px; height: 844px; position: relative;
    background: var(--bg);
    border-radius: 46px;
    box-shadow: 0 36px 80px rgba(53,40,28,0.34), 0 0 0 11px #221A14, 0 0 0 13px #4A3A29;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  /* status bar */
  .statusbar {
    height: 46px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 0 26px 0 30px; font-family: var(--head); font-weight: 700; font-size: 14px; color: var(--ink);
  }
  .statusbar .right { display: flex; align-items: center; gap: 7px; }
  /* header */
  .appheader {
    flex-shrink: 0; height: 62px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px; position: relative; z-index: 30;
    background: linear-gradient(to bottom, var(--bg) 72%, rgba(251,245,236,0));
  }
  .wordmark { font-family: var(--head); font-weight: 800; font-size: 21px; letter-spacing: -0.03em; color: var(--accent); }
  .wordmark .dash { color: var(--faint); font-weight: 600; }
  .datebtn {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 12px 8px 11px; cursor: pointer; box-shadow: 0 2px 7px rgba(53,40,28,0.06);
    font-family: var(--head); font-weight: 700; font-size: 14px; color: var(--ink);
  }
  .datebtn svg { display: block; }
  .chev { transition: transform .25s ease; }
  .datebtn.open .chev { transform: rotate(180deg); }
  /* scroll area */
  .scroller { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 22px; display: flex; flex-direction: column; gap: 10px; }
  .scroller::-webkit-scrollbar { width: 0; }
  /* profile card */
  .profile {
    display: flex; align-items: center; gap: 13px;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-card);
    box-shadow: 0 4px 14px rgba(53,40,28,0.06);
    padding: 16px 16px;
  }
  .avatar {
    width: 54px; height: 54px; flex-shrink: 0; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center;
    font-family: var(--head); font-weight: 800; font-size: 19px;
    border: 1.5px dashed color-mix(in oklab, var(--accent) 45%, white);
  }
  .profile .who { flex: 1; min-width: 0; }
  .profile .pname { font-family: var(--head); font-weight: 800; font-size: 17px; letter-spacing: -0.01em; }
  .profile .pmeta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .rolebadge {
    font-family: var(--head); font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
    background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 5px 10px; white-space: nowrap;
  }
  /* menu rows */
  .menuitem {
    display: flex; align-items: center; gap: 13px; width: 100%; text-align: left;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-card);
    box-shadow: 0 3px 10px rgba(53,40,28,0.05);
    padding: var(--rowpad, 14px) 16px; cursor: pointer; font-family: var(--body);
    transition: transform .12s, background .15s;
  }
  .menuitem:active { transform: scale(0.98); background: #FFFDFA; }
  .menuitem .ico {
    width: 42px; height: 42px; flex-shrink: 0; display: grid; place-items: center;
    border-radius: 14px; background: var(--accent-soft); color: var(--accent);
    position: relative;
  }
  .menuitem .ico .dot {
    position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px;
    border-radius: 999px; background: var(--accent); color: #fff;
    font-family: var(--head); font-weight: 800; font-size: 10.5px;
    display: grid; place-items: center; padding: 0 5px;
    border: 2px solid var(--card);
  }
  .menuitem .txt { flex: 1; min-width: 0; }
  .menuitem .title { font-family: var(--head); font-weight: 700; font-size: 15px; color: var(--ink); display: flex; align-items: center; gap: 7px; }
  .menuitem .subtitle { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.35; }
  .menuitem .chevr { flex-shrink: 0; color: var(--faint); }
  /* logout */
  .logoutwrap { margin-top: 14px; }
  .menuitem.logout .ico { background: var(--nonveg-bg); color: var(--nonveg); }
  .menuitem.logout .title { color: var(--nonveg); }
  .version { text-align: center; font-size: 11px; color: var(--faint); padding: 8px 0 2px; }
  /* bottom nav */
  .nav {
    flex-shrink: 0; height: 78px; display: flex; align-items: stretch; padding: 8px 14px 16px;
    background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -3px 18px rgba(53,40,28,0.07);
  }
  .navbtn { flex: 1; border: none; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--faint); font-family: var(--head); font-weight: 700; font-size: 11px; }
  .navbtn.on { color: var(--accent); }
  .navbtn .ico { display: grid; place-items: center; width: 56px; height: 34px; border-radius: 999px; transition: background .2s; }
  .navbtn.on .ico { background: var(--accent-soft); }
  /* date popover */
  .pop-scrim { position: absolute; inset: 0; z-index: 25; background: rgba(42,33,27,0.18); transition: opacity .2s; }
  .popover {
    position: absolute; top: 102px; right: 18px; z-index: 31; width: 210px;
    background: #fff; border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 18px 44px rgba(53,40,28,0.22);
    padding: 8px; transform-origin: top right;
    transition: transform .2s cubic-bezier(0.16,1,0.3,1), opacity .2s;
  }
  .pop-title { font-family: var(--head); font-weight: 800; font-size: 12px; color: var(--muted); padding: 6px 8px 8px; }
  .pop-item { display: flex; align-items: center; gap: 10px; width: 100%; border: none; background: transparent; cursor: pointer; padding: 11px 10px; border-radius: 12px; font-family: var(--head); font-weight: 700; font-size: 14px; color: var(--ink); text-align: left; }
  .pop-item:hover { background: var(--bg); }
  .pop-item.cur { background: var(--accent); color: #fff; }
  .pop-item .pd { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--faint); }
  .pop-item.cur .pd { color: rgba(255,255,255,0.8); }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel">
    const { useState } = React;
    const { useTweaks, TweaksPanel, TweakSection, TweakColor, TweakRadio, TweakToggle } = window;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent": "#E65100",
      "density": "regular",
      "showDatePicker": false
    }/*EDITMODE-END*/;

    /* ---------- inline line icons (Lucide geometry) ---------- */
    const Ico = ({ d, s = 22, sw = 2, c = 'currentColor' }) => (
      <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth={sw}
        strokeLinecap="round" strokeLinejoin="round" dangerouslySetInnerHTML={{ __html: d }} />
    );
    const I = {
      home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
      box: '<path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 8.7 5 8.7-5"/>',
      more: '<path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>',
      cal: '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
      chev: '<path d="m6 9 6 6 6-6"/>',
      chevr: '<path d="m9 18 6-6-6-6"/>',
      chef: '<path d="M17 21a1 1 0 0 0 1-1v-5.35c0-.457.316-.844.727-1.041a4 4 0 0 0-2.134-7.589 5 5 0 0 0-9.186 0 4 4 0 0 0-2.134 7.588c.411.198.727.585.727 1.041V20a1 1 0 0 0 1 1Z"/><path d="M6 17h12"/>',
      bell: '<path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>',
      clipboard: '<rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>',
      clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
      user: '<circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/>',
      logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>',
      wifi: '<path d="M12 20h.01"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M5 13a10 10 0 0 1 14 0"/>',
    };

    const DATE_META = { Tomorrow: 'Sat, 13 Jun', Today: 'Fri, 12 Jun', Yesterday: 'Thu, 11 Jun' };

    const MENU = [
      { id: 'cook', icon: 'chef', title: 'Cook View', subtitle: "Today's recipes and cook instructions" },
      { id: 'notif', icon: 'bell', title: 'Notifications', subtitle: 'Vote reminders, food ready alerts', badge: 2 },
      { id: 'templates', icon: 'clipboard', title: 'Meal Templates', subtitle: 'Edit breakfast, lunch, dinner components' },
      { id: 'times', icon: 'clock', title: 'Cook Times', subtitle: 'Morning: 8:00 AM  ·  Evening: 7:30 PM' },
      { id: 'profile', icon: 'user', title: 'Profile', subtitle: 'Housemate 1', role: 'Housemate' },
    ];

    function MenuItem({ item, onTap }) {
      return (
        <button className="menuitem" onClick={onTap}>
          <span className="ico">
            <Ico d={I[item.icon]} s={21} />
            {item.badge ? <span className="dot">{item.badge}</span> : null}
          </span>
          <span className="txt">
            <span className="title">
              {item.title}
              {item.role && <span className="rolebadge">{item.role}</span>}
            </span>
            <div className="subtitle">{item.subtitle}</div>
          </span>
          <span className="chevr"><Ico d={I.chevr} s={19} /></span>
        </button>
      );
    }

    function App() {
      const [day, setDay] = useState('Today');
      const [popOpen, setPopOpen] = useState(false);
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

      const rowpad = { compact: '10px', regular: '14px', comfy: '18px' }[t.density] || '14px';

      return (
        <React.Fragment>
        <div className="device" style={{
          '--accent': t.accent,
          '--accent-soft': `color-mix(in oklab, ${t.accent} 10%, #FFFEFB)`,
          '--rowpad': rowpad,
        }}>
          {/* status bar */}
          <div className="statusbar">
            <span>9:41</span>
            <span className="right">
              <Ico d={I.wifi} s={16} sw={2.2} c="#2A211B" />
              <span style={{ fontSize: 13 }}>100%</span>
            </span>
          </div>

          {/* header */}
          <div className="appheader">
            <span className="wordmark">kya<span className="dash">-</span>khana</span>
            {t.showDatePicker && (
              <button className={'datebtn' + (popOpen ? ' open' : '')} onClick={() => setPopOpen((o) => !o)}>
                <Ico d={I.cal} s={17} c="var(--accent)" />
                {day}
                <Ico d={I.chev} s={16} c="var(--faint)" />
              </button>
            )}
          </div>

          {/* content */}
          <div className="scroller">
            {/* logged-in user */}
            <div className="profile">
              <span className="avatar">H1</span>
              <span className="who">
                <div className="pname">Housemate 1</div>
                <div className="pmeta">Flat 302 · 4 members · 1 cook</div>
              </span>
              <span className="rolebadge">Housemate</span>
            </div>

            {MENU.map((item) => (
              <MenuItem key={item.id} item={item} />
            ))}

            <div className="logoutwrap">
              <button className="menuitem logout">
                <span className="ico"><Ico d={I.logout} s={20} /></span>
                <span className="txt">
                  <span className="title">Logout</span>
                  <div className="subtitle">Sign out of this household</div>
                </span>
                <span className="chevr"><Ico d={I.chevr} s={19} /></span>
              </button>
            </div>
            <div className="version">Kya Khana · क्या खाना · v1.0</div>
          </div>

          {/* date popover */}
          {t.showDatePicker && (
            <React.Fragment>
              <div className="pop-scrim"
                style={{ opacity: popOpen ? 1 : 0, pointerEvents: popOpen ? 'auto' : 'none' }}
                onClick={() => setPopOpen(false)} />
              <div className="popover"
                style={{
                  opacity: popOpen ? 1 : 0,
                  transform: popOpen ? 'translateY(0) scale(1)' : 'translateY(-8px) scale(0.97)',
                  pointerEvents: popOpen ? 'auto' : 'none',
                }}>
                <div className="pop-title">JUMP TO A DAY</div>
                {['Tomorrow', 'Today', 'Yesterday'].map((d) => (
                  <button key={d} className={'pop-item' + (d === day ? ' cur' : '')}
                    onClick={() => { setDay(d); setPopOpen(false); }}>
                    <Ico d={I.cal} s={16} c={d === day ? '#fff' : 'var(--accent)'} />
                    {d}
                    <span className="pd">{DATE_META[d]}</span>
                  </button>
                ))}
              </div>
            </React.Fragment>
          )}

          {/* bottom nav */}
          <div className="nav">
            <button className="navbtn" onClick={() => { window.location.href = 'Inventory.html'; }}>
              <span className="ico"><Ico d={I.box} s={22} /></span>Inventory
            </button>
            <button className="navbtn" onClick={() => { window.location.href = 'Dashboard.html'; }}>
              <span className="ico"><Ico d={I.home} s={22} /></span>Dashboard
            </button>
            <button className="navbtn on">
              <span className="ico"><Ico d={I.more} s={22} sw={2.4} /></span>More
            </button>
          </div>
        </div>

        <TweaksPanel>
          <TweakSection label="Theme" />
          <TweakColor label="Accent" value={t.accent}
            options={['#E65100', '#B23A2E', '#2E7D32']}
            onChange={(v) => setTweak('accent', v)} />
          <TweakSection label="Layout" />
          <TweakRadio label="Row density" value={t.density}
            options={['compact', 'regular', 'comfy']}
            onChange={(v) => setTweak('density', v)} />
          <TweakToggle label="Header date picker" value={t.showDatePicker}
            onChange={(v) => setTweak('showDatePicker', v)} />
        </TweaksPanel>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
