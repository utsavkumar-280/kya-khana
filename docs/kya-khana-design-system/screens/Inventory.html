<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kya Khana — Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --head: 'Plus Jakarta Sans', system-ui, sans-serif;
    --body: 'Be Vietnam Pro', system-ui, sans-serif;
    --bg: #FBF5EC;
    --card: #FFFFFF;
    --accent: #E65100;
    --accent-soft: #FFF1E3;
    --timer: #D84315;
    --veg: #2E7D32;
    --veg-bg: #E9F4EA;
    --nonveg: #C62828;
    --nonveg-bg: #FCEBEB;
    --whatsapp: #1FAF54;
    --ink: #2A211B;
    --muted: #8C8076;
    --faint: #B6ABA0;
    --line: #EDE3D6;
    --radius-card: 22px;
    --radius-inner: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #E7DDCD;
    font-family: var(--body);
    color: var(--ink);
    display: grid; place-items: center;
    padding: 18px;
  }
  .device {
    width: 390px; height: 844px; position: relative;
    background: var(--bg);
    border-radius: 46px;
    box-shadow: 0 36px 80px rgba(53,40,28,0.34), 0 0 0 11px #221A14, 0 0 0 13px #4A3A29;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  /* status bar */
  .statusbar {
    height: 46px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 0 26px 0 30px; font-family: var(--head); font-weight: 700; font-size: 14px; color: var(--ink);
  }
  .statusbar .right { display: flex; align-items: center; gap: 7px; }
  /* header */
  .appheader {
    flex-shrink: 0; height: 62px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px; position: relative; z-index: 30;
    background: linear-gradient(to bottom, var(--bg) 72%, rgba(251,245,236,0));
  }
  .wordmark { font-family: var(--head); font-weight: 800; font-size: 21px; letter-spacing: -0.03em; color: var(--accent); }
  .wordmark .dash { color: var(--faint); font-weight: 600; }
  .datebtn {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 12px 8px 11px; cursor: pointer; box-shadow: 0 2px 7px rgba(53,40,28,0.06);
    font-family: var(--head); font-weight: 700; font-size: 14px; color: var(--ink);
  }
  .datebtn svg { display: block; }
  .chev { transition: transform .25s ease; }
  .datebtn.open .chev { transform: rotate(180deg); }
  /* toggle bar */
  .togglewrap { flex-shrink: 0; padding: 4px 16px 12px; }
  .toggle {
    display: flex; gap: 4px; padding: 4px; background: #F2E9DB;
    border: 1px solid var(--line); border-radius: 999px;
  }
  .togglebtn {
    flex: 1; border: none; cursor: pointer; padding: 10px 12px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-family: var(--head); font-weight: 700; font-size: 14px; color: var(--muted);
    background: transparent; transition: background .2s, color .2s, box-shadow .2s;
  }
  .togglebtn.on { background: var(--accent); color: #fff; box-shadow: 0 4px 12px color-mix(in oklab, var(--accent) 30%, transparent); }
  .togglebtn .cnt {
    font-size: 11px; font-weight: 800; background: var(--nonveg); color: #fff;
    border-radius: 999px; padding: 1px 7px; line-height: 1.5;
  }
  .togglebtn.on .cnt { background: rgba(255,255,255,0.25); }
  /* scroll area */
  .scroller { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 22px; }
  .scroller::-webkit-scrollbar { width: 0; }
  /* section labels */
  .seclabel {
    font-family: var(--head); font-size: 11px; font-weight: 800; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted); margin: 16px 4px 7px;
    display: flex; align-items: center; gap: 6px;
  }
  .seclabel:first-child { margin-top: 6px; }
  /* generic card */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-card); overflow: hidden; }
  /* stock rows */
  .row {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    padding: var(--rowpad, 12px) 14px; border: none; border-bottom: 1px solid var(--line);
    background: transparent; cursor: pointer; font-family: var(--body);
    transition: background .15s;
  }
  .row:last-child { border-bottom: none; }
  .row:active { background: var(--bg); }
  .row .glyph {
    width: 40px; height: 40px; flex-shrink: 0; display: grid; place-items: center;
    background: var(--bg); border-radius: 13px; font-size: 20px;
  }
  .row .info { flex: 1; min-width: 0; }
  .row .name { font-size: 14.5px; font-weight: 600; color: var(--ink); line-height: 1.2; }
  .row .sub { font-size: 11.5px; color: var(--faint); margin-top: 2px; }
  .row .qty { font-family: var(--head); font-weight: 800; font-size: 14px; color: var(--ink); white-space: nowrap; }
  .row .qty .unit { font-weight: 600; font-size: 12px; color: var(--muted); margin-left: 2px; }
  /* inline stepper (expanded on tap) */
  .stepper { display: inline-flex; align-items: center; gap: 0; border: 1.5px solid var(--accent); border-radius: 999px; overflow: hidden; }
  .stepbtn {
    width: 32px; height: 30px; border: none; cursor: pointer; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent);
  }
  .stepbtn:active { background: var(--accent); color: #fff; }
  .stepval {
    min-width: 58px; text-align: center; font-family: var(--head); font-weight: 800; font-size: 13px;
    color: var(--ink); padding: 0 4px;
  }
  /* add item */
  .addbtn {
    margin-top: 16px; width: 100%; border: 1.5px dashed #DCC9AE; cursor: pointer;
    border-radius: 16px; padding: 13px 0; background: transparent;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    font-family: var(--head); font-weight: 700; font-size: 14px; color: var(--accent);
    transition: background .2s;
  }
  .addbtn:active { background: var(--accent-soft); }
  /* grocery rows */
  .grow {
    display: flex; align-items: center; gap: 12px; padding: var(--rowpad, 12px) 14px;
    border-bottom: 1px solid var(--line); position: relative;
  }
  .grow:last-child { border-bottom: none; }
  .grow.short { box-shadow: inset 3px 0 0 #EFB4A8; }
  .grow.have { opacity: 0.55; }
  .grow .glyph {
    width: 40px; height: 40px; flex-shrink: 0; display: grid; place-items: center;
    background: var(--bg); border-radius: 13px; font-size: 20px;
  }
  .grow .info { flex: 1; min-width: 0; }
  .grow .name { font-size: 14.5px; font-weight: 600; color: var(--ink); line-height: 1.2; }
  .grow.have .name, .grow.bought .name { text-decoration: line-through; color: var(--muted); }
  .grow.bought { opacity: 0.55; }
  .grow .meta { display: flex; align-items: center; gap: 7px; margin-top: 3px; }
  .grow .amount { font-size: 11.5px; color: var(--muted); font-weight: 500; }
  .tagpill { font-family: var(--head); font-size: 9px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; }
  .tagpill.buy { background: var(--nonveg-bg); color: var(--nonveg); }
  .tagpill.stock { background: var(--veg-bg); color: var(--veg); }
  /* checkbox */
  .checkbox {
    width: 28px; height: 28px; flex-shrink: 0; border-radius: 9px; cursor: pointer;
    border: 1.5px solid #D9CBB8; background: #fff; display: grid; place-items: center;
    color: #fff; transition: background .15s, border-color .15s;
  }
  .checkbox.checked { background: var(--veg); border-color: var(--veg); }
  .havecheck {
    width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%;
    background: var(--veg-bg); color: var(--veg); display: grid; place-items: center;
  }
  /* share button */
  .sharebtn {
    margin-top: 18px; width: 100%; border: none; cursor: pointer;
    border-radius: 16px; padding: 15px 0;
    background: var(--whatsapp); color: #fff;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-family: var(--head); font-weight: 800; font-size: 15px;
    box-shadow: 0 10px 26px rgba(31,175,84,0.32);
    transition: transform .12s;
  }
  .sharebtn:active { transform: scale(0.97); }
  .sharenote { text-align: center; font-size: 11px; color: var(--faint); margin-top: 9px; }
  /* auto-gen note */
  .autonote {
    display: flex; align-items: center; gap: 7px; margin: 8px 4px 0;
    font-size: 11.5px; color: var(--muted); font-weight: 500;
  }
  /* bottom nav */
  .nav {
    flex-shrink: 0; height: 78px; display: flex; align-items: stretch; padding: 8px 14px 16px;
    background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -3px 18px rgba(53,40,28,0.07);
  }
  .navbtn { flex: 1; border: none; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--faint); font-family: var(--head); font-weight: 700; font-size: 11px; }
  .navbtn.on { color: var(--accent); }
  .navbtn .ico { display: grid; place-items: center; width: 56px; height: 34px; border-radius: 999px; transition: background .2s; }
  .navbtn.on .ico { background: var(--accent-soft); }
  /* date popover */
  .pop-scrim { position: absolute; inset: 0; z-index: 25; background: rgba(42,33,27,0.18); transition: opacity .2s; }
  .popover {
    position: absolute; top: 102px; right: 18px; z-index: 31; width: 210px;
    background: #fff; border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 18px 44px rgba(53,40,28,0.22);
    padding: 8px; transform-origin: top right;
    transition: transform .2s cubic-bezier(0.16,1,0.3,1), opacity .2s;
  }
  .pop-title { font-family: var(--head); font-weight: 800; font-size: 12px; color: var(--muted); padding: 6px 8px 8px; }
  .pop-item { display: flex; align-items: center; gap: 10px; width: 100%; border: none; background: transparent; cursor: pointer; padding: 11px 10px; border-radius: 12px; font-family: var(--head); font-weight: 700; font-size: 14px; color: var(--ink); text-align: left; }
  .pop-item:hover { background: var(--bg); }
  .pop-item.cur { background: var(--accent); color: #fff; }
  .pop-item .pd { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--faint); }
  .pop-item.cur .pd { color: rgba(255,255,255,0.8); }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel">
    const { useState, useCallback } = React;
    const { useTweaks, TweaksPanel, TweakSection, TweakColor, TweakRadio, TweakToggle } = window;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent": "#E65100",
      "density": "compact",
      "showHindi": true,
      "showDatePicker": false
    }/*EDITMODE-END*/;

    /* ---------- inline line icons (Lucide geometry) ---------- */
    const Ico = ({ d, s = 22, sw = 2, c = 'currentColor' }) => (
      <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth={sw}
        strokeLinecap="round" strokeLinejoin="round" dangerouslySetInnerHTML={{ __html: d }} />
    );
    const I = {
      home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
      box: '<path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 8.7 5 8.7-5"/>',
      more: '<path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>',
      cal: '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
      chev: '<path d="m6 9 6 6 6-6"/>',
      check: '<path d="M20 6 9 17l-5-5"/>',
      plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
      minus: '<path d="M5 12h14"/>',
      share: '<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/>',
      refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/>',
      wifi: '<path d="M12 20h.01"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M5 13a10 10 0 0 1 14 0"/>',
    };

    /* ---------- data ---------- */
    const STOCK = [
      { cat: 'Vegetables', items: [
        { e: '🧅', n: 'Onion', hi: 'प्याज़', qty: 4, unit: 'pieces', step: 1 },
        { e: '🍅', n: 'Tomato', hi: 'टमाटर', qty: 6, unit: 'pieces', step: 1 },
        { e: '🥔', n: 'Potato', hi: 'आलू', qty: 8, unit: 'pieces', step: 1 },
        { e: '🥬', n: 'Spinach (Palak)', hi: 'पालक', qty: 200, unit: 'g', step: 50 },
        { e: '🫑', n: 'Capsicum', hi: 'शिमला मिर्च', qty: 3, unit: 'pieces', step: 1 },
        { e: '🧄', n: 'Garlic', hi: 'लहसुन', qty: 10, unit: 'cloves', step: 1 },
      ]},
      { cat: 'Dairy', items: [
        { e: '🧀', n: 'Paneer', hi: 'पनीर', qty: 400, unit: 'g', step: 50 },
        { e: '🥛', n: 'Curd (Yogurt)', hi: 'दही', qty: 500, unit: 'g', step: 50 },
        { e: '🧈', n: 'Butter', hi: 'मक्खन', qty: 200, unit: 'g', step: 50 },
      ]},
      { cat: 'Grains & Flours', items: [
        { e: '🌾', n: 'Wheat Flour (Atta)', hi: 'आटा', qty: 2, unit: 'kg', step: 0.5 },
        { e: '🍚', n: 'Basmati Rice', hi: 'चावल', qty: 1.5, unit: 'kg', step: 0.5 },
      ]},
      { cat: 'Lentils', items: [
        { e: '🫘', n: 'Toor Dal', hi: 'तूर दाल', qty: 500, unit: 'g', step: 50 },
        { e: '🫘', n: 'Moong Dal', hi: 'मूंग दाल', qty: 300, unit: 'g', step: 50 },
      ]},
    ];

    const GROCERY = [
      { meal: "For Tonight's Dinner", items: [
        { e: '🍗', n: 'Chicken', amt: '300g', short: true },
        { e: '🥛', n: 'Fresh Cream', amt: '50ml', short: true },
        { e: '🧅', n: 'Onion', amt: 'in stock', short: false },
        { e: '🍅', n: 'Tomato', amt: 'in stock', short: false },
        { e: '🫚', n: 'Ginger', amt: '15g', short: true },
      ]},
      { meal: 'For Tomorrow Breakfast', items: [
        { e: '🥚', n: 'Eggs', amt: '6 pieces', short: true },
        { e: '🧅', n: 'Onion', amt: 'in stock', short: false },
        { e: '🍞', n: 'Bread', amt: '1 pack', short: true },
      ]},
    ];

    const DATE_META = { Tomorrow: 'Fri, 12 Jun', Today: 'Thu, 11 Jun', Yesterday: 'Wed, 10 Jun' };
    const fmtQty = (q) => (Number.isInteger(q) ? q : q.toFixed(1));

    /* ---------- stock row (tap to edit) ---------- */
    function StockRow({ item, editing, showHindi, onTap, onQty }) {
      return (
        <button className="row" onClick={onTap}>
          <span className="glyph">{item.e}</span>
          <span className="info">
            <span className="name">{item.n}</span>
            {(editing || showHindi) && <div className="sub">{editing ? 'tap − / + to adjust' : item.hi}</div>}
          </span>
          {editing ? (
            <span className="stepper" onClick={(ev) => ev.stopPropagation()}>
              <button className="stepbtn" aria-label="Less" onClick={() => onQty(-item.step)}><Ico d={I.minus} s={15} sw={2.6} /></button>
              <span className="stepval">{fmtQty(item.qty)} {item.unit}</span>
              <button className="stepbtn" aria-label="More" onClick={() => onQty(item.step)}><Ico d={I.plus} s={15} sw={2.6} /></button>
            </span>
          ) : (
            <span className="qty">{fmtQty(item.qty)}<span className="unit">{item.unit}</span></span>
          )}
        </button>
      );
    }

    /* ---------- grocery row ---------- */
    function GroceryRow({ item, bought, onCheck }) {
      const cls = 'grow ' + (item.short ? 'short' : 'have') + (bought ? ' bought' : '');
      return (
        <div className={cls}>
          <span className="glyph">{item.e}</span>
          <span className="info">
            <span className="name">{item.n}</span>
            <span className="meta">
              <span className="amount">{item.short ? item.amt : 'already have it'}</span>
              {item.short
                ? <span className="tagpill buy">Need to buy</span>
                : <span className="tagpill stock">In stock</span>}
            </span>
          </span>
          {item.short ? (
            <button className={'checkbox' + (bought ? ' checked' : '')}
              aria-label={bought ? 'Bought' : 'Mark as bought'} onClick={onCheck}>
              {bought && <Ico d={I.check} s={16} sw={2.8} />}
            </button>
          ) : (
            <span className="havecheck"><Ico d={I.check} s={16} sw={2.8} /></span>
          )}
        </div>
      );
    }

    /* ---------- app ---------- */
    function App() {
      const [view, setView] = useState('stock');
      const [day, setDay] = useState('Today');
      const [popOpen, setPopOpen] = useState(false);
      const [stock, setStock] = useState(STOCK);
      const [editing, setEditing] = useState(null);
      const [bought, setBought] = useState({});
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

      const rowpad = { compact: '8px', regular: '12px', comfy: '16px' }[t.density] || '12px';

      const shortCount = GROCERY.reduce((n, g) => n + g.items.filter((i) => i.short).length, 0);

      const adjustQty = useCallback((cat, name, delta) => {
        setStock((prev) => prev.map((g) => g.cat !== cat ? g : {
          ...g,
          items: g.items.map((it) => it.n !== name ? it : { ...it, qty: Math.max(0, Math.round((it.qty + delta) * 10) / 10) }),
        }));
      }, []);

      return (
        <React.Fragment>
        <div className="device" style={{
          '--accent': t.accent,
          '--accent-soft': `color-mix(in oklab, ${t.accent} 10%, #FFFEFB)`,
          '--rowpad': rowpad,
        }}>
          {/* status bar */}
          <div className="statusbar">
            <span>9:41</span>
            <span className="right">
              <Ico d={I.wifi} s={16} sw={2.2} c="#2A211B" />
              <span style={{ fontSize: 13 }}>100%</span>
            </span>
          </div>

          {/* header */}
          <div className="appheader">
            <span className="wordmark">kya<span className="dash">-</span>khana</span>
            {t.showDatePicker && (
              <button className={'datebtn' + (popOpen ? ' open' : '')} onClick={() => setPopOpen((o) => !o)}>
                <Ico d={I.cal} s={17} c="var(--accent)" />
                {day}
                <Ico d={I.chev} s={16} c="var(--faint)" />
              </button>
            )}
          </div>

          {/* toggle bar */}
          <div className="togglewrap">
            <div className="toggle">
              <button className={'togglebtn' + (view === 'stock' ? ' on' : '')} onClick={() => setView('stock')}>
                Stock
              </button>
              <button className={'togglebtn' + (view === 'grocery' ? ' on' : '')} onClick={() => setView('grocery')}>
                Grocery List <span className="cnt">{shortCount}</span>
              </button>
            </div>
          </div>

          {/* content */}
          <div className="scroller">
            {view === 'stock' ? (
              <div>
                {stock.map((group) => (
                  <div key={group.cat}>
                    <div className="seclabel">{group.cat}</div>
                    <div className="card">
                      {group.items.map((it) => (
                        <StockRow key={it.n} item={it}
                          editing={editing === group.cat + it.n}
                          showHindi={t.showHindi}
                          onTap={() => setEditing(editing === group.cat + it.n ? null : group.cat + it.n)}
                          onQty={(d) => adjustQty(group.cat, it.n, d)}
                        />
                      ))}
                    </div>
                  </div>
                ))}
                <button className="addbtn"><Ico d={I.plus} s={17} sw={2.4} /> Add Item</button>
              </div>
            ) : (
              <div>
                <div className="autonote">
                  <Ico d={I.refresh} s={13} c="var(--accent)" />
                  Auto-generated from decided meals
                </div>
                {GROCERY.map((group) => (
                  <div key={group.meal}>
                    <div className="seclabel">{group.meal}</div>
                    <div className="card">
                      {group.items.map((it) => (
                        <GroceryRow key={group.meal + it.n} item={it}
                          bought={!!bought[group.meal + it.n]}
                          onCheck={() => setBought((b) => ({ ...b, [group.meal + it.n]: !b[group.meal + it.n] }))}
                        />
                      ))}
                    </div>
                  </div>
                ))}
                <button className="sharebtn"><Ico d={I.share} s={18} sw={2.3} /> Share via WhatsApp</button>
                <div className="sharenote">Sends only the items still left to buy</div>
              </div>
            )}
          </div>

          {/* date popover */}
          {t.showDatePicker && (
            <React.Fragment>
          <div className="pop-scrim"
            style={{ opacity: popOpen ? 1 : 0, pointerEvents: popOpen ? 'auto' : 'none' }}
            onClick={() => setPopOpen(false)} />
          <div className="popover"
            style={{
              opacity: popOpen ? 1 : 0,
              transform: popOpen ? 'translateY(0) scale(1)' : 'translateY(-8px) scale(0.97)',
              pointerEvents: popOpen ? 'auto' : 'none',
            }}>
            <div className="pop-title">JUMP TO A DAY</div>
            {['Tomorrow', 'Today', 'Yesterday'].map((d) => (
              <button key={d} className={'pop-item' + (d === day ? ' cur' : '')}
                onClick={() => { setDay(d); setPopOpen(false); }}>
                <Ico d={I.cal} s={16} c={d === day ? '#fff' : 'var(--accent)'} />
                {d}
                <span className="pd">{DATE_META[d]}</span>
              </button>
            ))}
          </div>
            </React.Fragment>
          )}

          {/* bottom nav */}
          <div className="nav">
            <button className="navbtn on">
              <span className="ico"><Ico d={I.box} s={22} sw={2.4} /></span>Inventory
            </button>
            <button className="navbtn" onClick={() => { window.location.href = 'Dashboard.html'; }}>
              <span className="ico"><Ico d={I.home} s={22} /></span>Dashboard
            </button>
            <button className="navbtn">
              <span className="ico"><Ico d={I.more} s={22} /></span>More
            </button>
          </div>
        </div>

        <TweaksPanel>
          <TweakSection label="Theme" />
          <TweakColor label="Accent" value={t.accent}
            options={['#E65100', '#B23A2E', '#2E7D32']}
            onChange={(v) => setTweak('accent', v)} />
          <TweakSection label="Layout" />
          <TweakRadio label="Row density" value={t.density}
            options={['compact', 'regular', 'comfy']}
            onChange={(v) => setTweak('density', v)} />
          <TweakToggle label="Hindi names" value={t.showHindi}
            onChange={(v) => setTweak('showHindi', v)} />
          <TweakToggle label="Header date picker" value={t.showDatePicker}
            onChange={(v) => setTweak('showDatePicker', v)} />
        </TweaksPanel>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
