<!-- @dsCard group="Spacing" viewport="700x170" name="Radii & Shadows" subtitle="Friendly rounding; soft warm-tinted elevation" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-app); font-family: var(--font-sans); }
  .row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .box { width: 64px; height: 64px; background: var(--surface-card); display: grid; place-items: center; }
  .lab { font-size: 11px; font-weight: 700; color: var(--text-primary); margin-top: 8px; text-align: center; }
  .item { text-align: center; }
  .sep { width: 1px; height: 64px; background: var(--border); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-sm); border:1px solid var(--border)"></div><div class="lab">sm · 10</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md); border:1px solid var(--border)"></div><div class="lab">md · 14</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg); border:1px solid var(--border)"></div><div class="lab">lg · 18</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl); border:1px solid var(--border)"></div><div class="lab">xl · 24</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-pill); width:90px; border:1px solid var(--border)"></div><div class="lab">pill</div></div>
    <div class="sep"></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg); box-shadow:var(--shadow-sm)"></div><div class="lab">sm</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg); box-shadow:var(--shadow-md)"></div><div class="lab">md</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg); box-shadow:var(--shadow-snap)"></div><div class="lab">snap</div></div>
  </div>
</body>
</html>
