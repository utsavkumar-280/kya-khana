<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4px base grid — 1 through 16" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-app); font-family: var(--font-sans); }
  .row { display: flex; gap: 16px; align-items: flex-end; }
  .item { text-align: center; }
  .bar { background: var(--saffron-300); border-radius: 4px; width: 100%; }
  .b1 { height: 4px } .b2 { height: 8px } .b3 { height: 12px } .b4 { height: 16px }
  .b5 { height: 20px } .b6 { height: 24px } .b8 { height: 32px } .b10 { height: 40px } .b12 { height: 48px }
  .swab { width: 40px; background: var(--saffron-400); border-radius: 4px; margin: 0 auto; }
  .lab { font-size: 11px; font-weight: 700; color: var(--text-primary); margin-top: 8px; }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="swab b1"></div><div class="lab">1</div><div class="px">4px</div></div>
    <div class="item"><div class="swab b2"></div><div class="lab">2</div><div class="px">8px</div></div>
    <div class="item"><div class="swab b3"></div><div class="lab">3</div><div class="px">12px</div></div>
    <div class="item"><div class="swab b4"></div><div class="lab">4</div><div class="px">16px</div></div>
    <div class="item"><div class="swab b5"></div><div class="lab">5</div><div class="px">20px</div></div>
    <div class="item"><div class="swab b6"></div><div class="lab">6</div><div class="px">24px</div></div>
    <div class="item"><div class="swab b8"></div><div class="lab">8</div><div class="px">32px</div></div>
    <div class="item"><div class="swab b10"></div><div class="lab">10</div><div class="px">40px</div></div>
    <div class="item"><div class="swab b12"></div><div class="lab">12</div><div class="px">48px</div></div>
  </div>
</body>
</html>
