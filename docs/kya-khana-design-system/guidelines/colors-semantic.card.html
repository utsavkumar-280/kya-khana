<!-- @dsCard group="Colors" viewport="700x200" name="Veg / Non-Veg & States" subtitle="Herb green vs chili red diet badges; meal-card state colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-app); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .tile { border-radius: var(--radius-md); padding: 12px 14px; box-shadow: var(--shadow-xs); }
  .dot { width: 28px; height: 28px; border-radius: 50%; margin-bottom: 8px; }
  .lab { font-size: 12px; font-weight: 700; }
  .hex { font-family: var(--font-mono); font-size: 10px; opacity: 0.75; text-transform: uppercase; }
  .section { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 8px; }
</style>
</head>
<body>
  <div class="section">Diet semantics</div>
  <div class="grid" style="margin-bottom:14px">
    <div class="tile" style="background:var(--veg-bg); border:1px solid var(--veg-border)"><div class="dot" style="background:var(--veg)"></div><div class="lab" style="color:var(--veg-700)">🌿 Veg</div><div class="hex" style="color:var(--veg-700)">#2E7D32</div></div>
    <div class="tile" style="background:var(--nonveg-bg); border:1px solid var(--nonveg-border)"><div class="dot" style="background:var(--nonveg)"></div><div class="lab" style="color:var(--nonveg-700)">🍗 Non-Veg</div><div class="hex" style="color:var(--nonveg-700)">#C62828</div></div>
    <div class="tile" style="background:var(--warning-bg); border:1px solid var(--turmeric-300)"><div class="dot" style="background:var(--turmeric-400)"></div><div class="lab" style="color:var(--saffron-800)">Turmeric</div><div class="hex" style="color:var(--saffron-800)">#F0B82E</div></div>
  </div>
  <div class="section">Meal-card states</div>
  <div class="grid">
    <div class="tile" style="background:var(--surface-card); border:1px solid var(--border)"><div class="dot" style="background:var(--state-active)"></div><div class="lab" style="color:var(--saffron-700)">Active</div><div class="hex">live voting</div></div>
    <div class="tile" style="background:var(--surface-card); border:1px solid var(--border)"><div class="dot" style="background:var(--state-locked)"></div><div class="lab" style="color:var(--neutral-600)">Locked</div><div class="hex">future / greyed</div></div>
    <div class="tile" style="background:var(--surface-card); border:1px solid var(--border)"><div class="dot" style="background:var(--state-decided)"></div><div class="lab" style="color:var(--veg-700)">Decided ✅</div><div class="hex">past / result</div></div>
  </div>
</body>
</html>
