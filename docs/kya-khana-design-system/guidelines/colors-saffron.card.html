<!-- @dsCard group="Colors" viewport="700x190" name="Saffron — Primary" subtitle="Turmeric-orange brand scale; 500 is the primary action color" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-app); }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-xs); }
  .chip { height: 64px; }
  .meta { padding: 8px 10px; background: var(--surface-card); font-family: var(--font-sans); }
  .name { font-size: 12px; font-weight: 700; color: var(--text-primary); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
  .star { color: var(--saffron-600); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--saffron-100)"></div><div class="meta"><div class="name">100</div><div class="hex">#FFE0C4</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--saffron-200)"></div><div class="meta"><div class="name">200</div><div class="hex">#FFC392</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--saffron-300)"></div><div class="meta"><div class="name">300</div><div class="hex">#FBA15C</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--saffron-400)"></div><div class="meta"><div class="name">400</div><div class="hex">#F47E2E</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--saffron-500)"></div><div class="meta"><div class="name star">500 ★</div><div class="hex">#E65100</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--saffron-600)"></div><div class="meta"><div class="name">600</div><div class="hex">#CC4710</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--saffron-700)"></div><div class="meta"><div class="name">700</div><div class="hex">#A63A10</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--saffron-900)"></div><div class="meta"><div class="name">900</div><div class="hex">#6B2811</div></div></div>
  </div>
</body>
</html>
