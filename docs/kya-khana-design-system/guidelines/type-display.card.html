<!-- @dsCard group="Type" viewport="700x210" name="Wordmark & Display — Plus Jakarta Sans" subtitle="Geometric display for the wordmark, card titles & hero numbers" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-app); font-family: var(--font-display); }
  .wm { font-size: 40px; font-weight: 800; letter-spacing: -0.03em; color: var(--text-brand); line-height: 1; }
  .wm .dash { color: var(--text-muted); font-weight: 600; }
  .deva { font-family: var(--font-deva); font-size: 28px; font-weight: 700; color: var(--saffron-600); margin-top: 6px; }
  .row { display: flex; align-items: baseline; gap: 18px; margin-top: 18px; flex-wrap: wrap; }
  .spec { color: var(--text-primary); }
  .s1 { font-size: 30px; font-weight: 700; }
  .s2 { font-size: 24px; font-weight: 600; }
  .tag { font-family: var(--font-sans); font-size: 11px; color: var(--text-muted); display:block; margin-top: 2px; }
</style>
</head>
<body>
  <div class="wm">kya<span class="dash">-</span>khana</div>
  <div class="deva">क्या खाना</div>
  <div class="row">
    <div><div class="spec s1">Tonight's Dinner</div><span class="tag">800 · card hero</span></div>
    <div><div class="spec s2">Paneer Butter Masala</div><span class="tag">600 · dish name</span></div>
  </div>
</body>
</html>
