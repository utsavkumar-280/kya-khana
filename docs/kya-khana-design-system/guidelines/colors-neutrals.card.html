<!-- @dsCard group="Colors" viewport="700x190" name="Warm Neutrals" subtitle="Cream canvas and taupe-tinted greys — never cool grey" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-app); }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-xs); border: 1px solid var(--border); }
  .chip { height: 64px; }
  .meta { padding: 8px 10px; background: var(--surface-card); font-family: var(--font-sans); }
  .name { font-size: 12px; font-weight: 700; color: var(--text-primary); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--cream)"></div><div class="meta"><div class="name">cream</div><div class="hex">#FBF5EC</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-50)"></div><div class="meta"><div class="name">50</div><div class="hex">#F4ECE0</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-100)"></div><div class="meta"><div class="name">100</div><div class="hex">#EDE3D6</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-200)"></div><div class="meta"><div class="name">200</div><div class="hex">#DDCFBE</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-400)"></div><div class="meta"><div class="name">400</div><div class="hex">#B6ABA0</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-600)"></div><div class="meta"><div class="name">600</div><div class="hex">#6E635A</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-800)"></div><div class="meta"><div class="name">800</div><div class="hex">#382F28</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--neutral-900)"></div><div class="meta"><div class="name">900</div><div class="hex">#2A211B</div></div></div>
  </div>
</body>
</html>
