<!-- @dsCard group="Components" viewport="430x360" name="Inventory — Stock & Grocery Rows" subtitle="Editable stock steppers and grocery need-vs-have rows" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--neutral-100); font-family: var(--font-sans); }
  .panel { width: 390px; margin: 0 auto; background: var(--surface-card); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-md); }
  .head { padding: 10px 16px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); background: var(--surface-sunken); }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { InventoryRow } = window.KyaKhanaDesignSystem_6941ec;
    function Demo() {
      const [paneer, setPaneer] = React.useState(200);
      const [bought, setBought] = React.useState(false);
      return (
        <div style={{display:'grid', gap:18}}>
          <div className="panel">
            <div className="head">Stock</div>
            <InventoryRow variant="stock" name="Paneer" hindi="पनीर" emoji="🧀" qty={paneer} unit="g" onQty={setPaneer} />
            <InventoryRow variant="stock" name="Onions" hindi="प्याज़" emoji="🧅" qty={6} unit=" pcs" onQty={()=>{}} />
            <InventoryRow variant="stock" name="Atta" hindi="आटा" emoji="🌾" qty={2} unit="kg" onQty={()=>{}} style={{borderBottom:'none'}} />
          </div>
          <div className="panel">
            <div className="head">Grocery List</div>
            <InventoryRow variant="grocery" name="Tomatoes" hindi="टमाटर" emoji="🍅" need={6} have={2} unit=" pcs" checked={bought} onCheck={setBought} />
            <InventoryRow variant="grocery" name="Cream" hindi="क्रीम" emoji="🥛" need={200} have={0} unit="g" onCheck={()=>{}} />
            <InventoryRow variant="grocery" name="Coriander" hindi="धनिया" emoji="🌿" need={1} have={1} unit=" bunch" onCheck={()=>{}} style={{borderBottom:'none'}} />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
