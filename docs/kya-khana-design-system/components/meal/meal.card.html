<!-- @dsCard group="Components" viewport="1140x640" name="Meal — Card states, Combos & Countdown" subtitle="Active / Locked / Decided meal cards with voting" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-app); font-family: var(--font-sans); }
  .row { display: flex; gap: 20px; align-items: flex-start; }
  .col { width: 350px; flex-shrink: 0; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { MealCard } = window.KyaKhanaDesignSystem_6941ec;
    const dinnerCombos = [
      { letter:'A', diet:'veg', votes:2, items:[
        {emoji:'🫓', name:'Roti', hindi:'रोटी'},
        {emoji:'🧀', name:'Paneer Butter Masala', diet:'veg'},
        {emoji:'🫘', name:'Dal Tadka'},
        {emoji:'🥗', name:'Boondi Raita'} ], winner:true },
      { letter:'B', diet:'nonveg', votes:1, vegVariant:'Aloo Gobi instead of Chicken Curry', items:[
        {emoji:'🍚', name:'Jeera Rice'},
        {emoji:'🍗', name:'Chicken Curry', diet:'nonveg'},
        {emoji:'🥗', name:'Green Salad'} ] },
    ];
    function Demo() {
      const [vote, setVote] = React.useState('A');
      return (
        <div className="row">
          <div className="col">
            <MealCard meal="Tonight's Dinner" hindi="रात का खाना" when="Today · Evening"
              state="active" snapped seconds={8049} combos={dinnerCombos}
              userVote={vote} onVote={setVote} />
          </div>
          <div className="col">
            <MealCard meal="Tomorrow Breakfast" hindi="नाश्ता" when="Tomorrow · Morning"
              state="locked" seconds={36120} combos={[
                { letter:'A', diet:'veg', votes:0, items:[
                  {emoji:'🥔', name:'Aloo Paratha'},
                  {emoji:'🥛', name:'Curd & Pickle'} ] },
                { letter:'B', diet:'veg', votes:0, items:[
                  {emoji:'🍚', name:'Poha', hindi:'पोहा'},
                  {emoji:'🍋', name:'Sev & Lemon'} ] },
              ]} />
          </div>
          <div className="col">
            <MealCard meal="Yesterday Dinner" when="Yesterday · Evening"
              state="decided" combos={dinnerCombos} />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
