<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--neutral-100); font-family: var(--font-sans); }
  .phone { width: 390px; margin: 0 auto; background: var(--bg-app); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; height: 280px; }
  .body { flex: 1; display: grid; place-items: center; color: var(--text-muted); font-size: 13px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { AppHeader, BottomNav } = window.KyaKhanaDesignSystem_6941ec;
    function Demo() {
      const [tab, setTab] = React.useState('dashboard');
      return (
        <div className="phone">
          <AppHeader date="Today" showBell notifications={3} />
          <div className="body">Scroll = time navigation</div>
          <BottomNav active={tab} onChange={setTab} />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
